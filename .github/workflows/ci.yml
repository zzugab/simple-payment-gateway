name: CI

on:
  push:
    branches: [main, feature/payment-foundation-db]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - name: Download dependencies
        run: go mod tidy
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build
        run: go build ./cmd/api
      - name: Check formatting
        if: always()
        run: |
          gofmt -l -d ./cmd ./internal
          test -z "$(gofmt -l ./cmd ./internal)"
