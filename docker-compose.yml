services:
  postgres:
    image: postgres:17-alpine
    container_name: simple-payment-gateway-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: payment_lab
      POSTGRES_USER: payment
      POSTGRES_PASSWORD: payment_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment -d payment_lab"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
