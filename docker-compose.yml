services:
  postgres:
    image: postgres:17-alpine
    container_name: simple-payment-gateway-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-payment_lab}
      POSTGRES_USER: ${POSTGRES_USER:-payment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-payment_dev_password}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-payment} -d ${POSTGRES_DB:-payment_lab}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: migrate/migrate:v4.18.3
    container_name: simple-payment-gateway-migrate
    volumes:
      - ./db/migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://${POSTGRES_USER:-payment}:${POSTGRES_PASSWORD:-payment_dev_password}@postgres:5432/${POSTGRES_DB:-payment_lab}?sslmode=disable"
      - "up"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: simple-payment-gateway-api
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      HTTP_ADDR: :8080
      MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY:-}
      DATABASE_URL: postgres://${POSTGRES_USER:-payment}:${POSTGRES_PASSWORD:-payment_dev_password}@postgres:5432/${POSTGRES_DB:-payment_lab}?sslmode=disable
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
